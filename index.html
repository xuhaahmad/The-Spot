<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="The Spot — find a café in Islamabad that fits your mood, budget and plans." />
    <meta name="color-scheme" content="light dark" />
    <!-- Espresso-cup icon: SVG for modern browsers (adapts to dark tabs),
         a 32px PNG fallback, and a 180px icon for iOS home screens -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>The Spot — There's a spot for that.</title>
    <script>
      // Runs before the page paints so there is no flash of the wrong theme.
      // Keep the storage key and logic in sync with src/lib/theme.js.
      (function () {
        var theme = null
        try {
          var stored = localStorage.getItem('the-spot:theme')
          if (stored === 'light' || stored === 'dark') theme = stored
        } catch (e) {}
        if (!theme) {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
